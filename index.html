<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="description" content="تواصل مع محمد أجمي">
<title>محمد أجمي | تواصل معي</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:24px; font-family:Arial,Tahoma,sans-serif;
  background:linear-gradient(135deg,#0b1220,#18253d 55%,#0b1220); color:#fff;
}
.card{
  width:min(430px,100%); padding:34px 24px 28px; border-radius:28px;
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14);
  box-shadow:0 25px 70px rgba(0,0,0,.35); backdrop-filter:blur(16px);
  text-align:center;
}
.avatar{
  width:92px;height:92px;margin:0 auto 18px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#fff,#d9e2ef); color:#142033;
  font-size:30px;font-weight:800;
}
h1{margin:0;font-size:28px}
p{margin:9px 0 26px;color:#cbd5e1;font-size:15px}
a{
  display:flex;align-items:center;justify-content:center;gap:12px;
  min-height:58px;margin:13px 0;padding:0 20px;border-radius:16px;
  text-decoration:none;font-size:17px;font-weight:700;
  background:#fff;color:#101827; transition:.18s;
}
a:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(0,0,0,.25)}
.icon{font-size:22px;width:28px}
.note{margin-top:22px;font-size:12px;color:#94a3b8}
</style>
</head>
<body>
<main class="card">
  <div class="avatar">MA</div>
  <h1>محمد أجمي</h1>
  <p>اختار وسيلة التواصل المناسبة</p>

  <a href="https://www.facebook.com/profile.php?id=61570933880104" target="_blank" rel="noopener">
    <span class="icon">f</span><span>Facebook</span>
  </a>

  <a href="mailto:mohammedagamy07@gmail.com">
    <span class="icon">✉</span><span>إرسال بريد إلكتروني</span>
  </a>

  <a href="tel:01152874022">
    <span class="icon">☎</span><span>اتصال هاتفي</span>
  </a>

  <div class="note">صفحة تواصل شخصية</div>
</main>
</body>
</html>
